openapi: 3.0.3
info:
  title: Shiso Demo API
  description: A small example API used to demonstrate Shiso's OpenAPI support.
  version: 1.0.0
servers:
  - url: https://api.example.com/v1
security:
  - bearerAuth: []
tags:
  - name: User
  - name: Events
paths:
  /users:
    get:
      operationId: listUsers
      tags: [User]
      summary: List users
      description: Returns a paginated list of users.
      parameters:
        - name: limit
          in: query
          description: Maximum number of results to return.
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          description: Number of results to skip.
          schema:
            type: integer
      responses:
        '200':
          description: A list of users.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
    post:
      operationId: createUser
      tags: [User]
      summary: Create a user
      description: Creates a new user account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewUser'
      responses:
        '201':
          description: The created user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '422':
          description: The user could not be created.
  /users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: User identifier.
        schema:
          type: string
          format: uuid
    get:
      operationId: getUser
      tags: [User]
      summary: Get a user
      description: Returns a user by ID.
      responses:
        '200':
          description: The requested user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: No user with this ID exists.
    delete:
      operationId: deleteUser
      tags: [User]
      summary: Delete a user
      description: Deletes a user by ID.
      responses:
        '204':
          description: The user was deleted.
  /users/{id}/events:
    get:
      operationId: listEvents
      tags: [Events]
      summary: List events
      description: Returns events recorded for a user, newest first.
      parameters:
        - name: id
          in: path
          required: true
          description: User identifier.
          schema:
            type: string
            format: uuid
        - name: type
          in: query
          description: Filter by event type.
          schema:
            type: string
            enum: [pageview, click, custom]
      responses:
        '200':
          description: A list of events.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    User:
      type: object
      required: [id, name, email]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Display name of the user.
          example: Ada Lovelace
        email:
          type: string
          format: email
          description: Email address of the user.
          example: ada@example.com
        createdAt:
          type: string
          format: date-time
    NewUser:
      type: object
      required: [name, email]
      properties:
        name:
          type: string
          example: Ada Lovelace
        email:
          type: string
          format: email
          example: ada@example.com
    Event:
      type: object
      required: [id, type]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [pageview, click, custom]
        url:
          type: string
          description: Page URL where the event occurred.
        timestamp:
          type: string
          format: date-time
