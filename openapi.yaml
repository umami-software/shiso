openapi: 3.0.3
info:
  title: Shiso Demo API
  description: A small example API used to demonstrate Shiso's OpenAPI support.
  version: 1.0.0
servers:
  - url: https://api.example.com/v1
security:
  - bearerAuth: []
tags:
  - name: Users API
paths:
  /users:
    get:
      operationId: listUsers
      tags: [Users API]
      summary: List users
      description: Returns a paginated list of users.
      parameters:
        - name: limit
          in: query
          description: Maximum number of results to return.
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          description: Number of results to skip.
          schema:
            type: integer
      responses:
        '200':
          description: A list of users.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
    post:
      operationId: createUser
      tags: [Users API]
      summary: Create a user
      description: Creates a new user account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewUser'
      responses:
        '201':
          description: The created user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '422':
          description: The user could not be created.
  /users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: User identifier.
        schema:
          type: string
          format: uuid
    get:
      operationId: getUser
      tags: [Users API]
      summary: Get a user
      description: Returns a user by ID.
      responses:
        '200':
          description: The requested user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: No user with this ID exists.
    delete:
      operationId: deleteUser
      tags: [Users API]
      summary: Delete a user
      description: Deletes a user by ID.
      responses:
        '204':
          description: The user was deleted.
x-webhooks:
  user.created:
    post:
      tags: [Users API]
      summary: User created
      description: Sent to your webhook URL when a new user account is created.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event, data]
              properties:
                event:
                  type: string
                  enum: [user.created]
                  description: The event name.
                data:
                  $ref: '#/components/schemas/User'
      responses:
        '200':
          description: Return any 2xx status to acknowledge receipt.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    User:
      type: object
      required: [id, name, email]
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the user.
        name:
          type: string
          description: Display name of the user.
          example: Ada Lovelace
        email:
          type: string
          format: email
          description: Email address of the user.
          example: ada@example.com
        createdAt:
          type: string
          format: date-time
          description: Date and time when the user was created.
    NewUser:
      type: object
      required: [name, email]
      properties:
        name:
          type: string
          description: Display name of the user.
          example: Ada Lovelace
        email:
          type: string
          format: email
          description: Email address of the user.
          example: ada@example.com
